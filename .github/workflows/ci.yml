name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    
    defaults:
      run:
        working-directory: backend
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -r requirements-mcp.txt

      - name: Verify MCP SDK is installed
        run: python -c "import mcp"

      - name: Run tests (including real MCP stdio and bounded harness)
        run: python -m pytest -v

  semantic-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-rag.txt
      - run: python -m pytest tests/test_verified_integration.py -v
        working-directory: backend
        env:
          RUN_SEMANTIC_INTEGRATION: "1"
