name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    
    defaults:
      run:
        working-directory: backend
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -r requirements-mcp.txt

      - name: Verify MCP SDK is installed
        run: python -c "import mcp"

      - name: Run tests (including real MCP stdio and bounded harness)
        run: python -m pytest -v

  semantic-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements-rag.txt -r backend/requirements-mcp.txt
      - run: python -m pytest tests/test_verified_integration.py tests/test_semantic_mcp_integration.py -v
        working-directory: backend
        env:
          RUN_SEMANTIC_INTEGRATION: "1"
          HF_HOME: ${{ runner.temp }}/hf-cache
          TOKENIZERS_PARALLELISM: "false"

      - name: Run Stage 4A bilingual benchmark against a fresh real index
        run: python -m app.evaluation --mode semantic --db "${{ runner.temp }}/stage4a-index" --output "${{ runner.temp }}/stage4a-report.json"
        working-directory: backend
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
          TOKENIZERS_PARALLELISM: "false"
      - name: Preserve benchmark report even when quality is imperfect
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4a-semantic-evaluation
          path: ${{ runner.temp }}/stage4a-report.json
          if-no-files-found: error
