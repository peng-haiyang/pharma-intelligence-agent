name: Hosted live demo checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test hosted/tests/*.test.mjs
      - run: node --check frontend/app.js
      - run: python scripts/build_hosted.py
      - run: node --check dist-hosted/server/index.js
      - run: python scripts/evaluate_hosted.py
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-live-demo-${{ github.sha }}
          path: |
            dist-hosted/
            benchmarks/hosted-lexical-report.json
