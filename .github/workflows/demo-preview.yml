name: Demo preview artifact
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: development-demo-${{ github.sha }}
          path: dist/
